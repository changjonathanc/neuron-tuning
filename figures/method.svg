   <g id="text_1">
    <text style="font-weight: 700; font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="18" y="32.617734" transform="rotate(-0 18 32.617734)">How a local edit is made and measured</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="18" y="56.558437" transform="rotate(-0 18 56.558437)">The baseline is a LoRA trained on the same data. All methods are compared at the same strength of the new behaviour.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="33.84" y="96.238125" transform="rotate(-0 33.84 96.238125)">1  A behaviour</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(33.84 122.739562)">for example “talk</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(33.84 136.509562)">casually”, set by a</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(33.84 150.279562)">system prompt; the target</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(33.84 165.037688)">is the model’s own</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(33.84 177.819562)">replies with that prompt</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="223.2" y="96.238125" transform="rotate(-0 223.2 96.238125)">2  Find neurons</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(223.2 123.727687)">MLP neurons that fire</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(223.2 136.509562)">on the target replies</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(223.2 150.279562)">and are quiet on</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(223.2 165.037688)">other text</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="412.56" y="96.238125" transform="rotate(-0 412.56 96.238125)">3  Train their output</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(412.56 122.739562)">only the output weights</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(412.56 136.367719)">(down_proj) of 8 or 128</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(412.56 150.657281)">neurons; 8 neurons =</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(412.56 164.517328)">12 k numbers, about</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(412.56 178.807687)">a rank-1 LoRA</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="601.92" y="96.238125" transform="rotate(-0 601.92 96.238125)">4  Side effects</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(601.92 122.739562)">the change on unrelated</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(601.92 136.912781)">text: code, math, QA,</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(601.92 150.279562)">German, Spanish,</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(601.92 164.049562)">Japanese, long</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(601.92 178.807687)">documents</text>
   </g>
  </g>
 </g>
